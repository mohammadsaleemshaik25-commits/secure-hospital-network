spring.datasource.url=jdbc:h2:mem:hospitaldb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Dynamic platform port with local fallback 8083
server.port=${PORT:8083}

# CORS allowed origins (comma-separated exact origins, overridden by CORS_ALLOWED_ORIGINS env var)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
